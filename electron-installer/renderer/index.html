<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My-Neuro 安装器测试</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="typography.css"><link rel="stylesheet" href="prototype.css"></head><body>
<aside><div class="brand"><div class="logo">N</div><span>My-Neuro</span></div><div class="steps"><div class="step active"><i>1</i><span>选择版本</span></div><div class="step"><i>2</i><span>下载程序</span></div><div class="step"><i>3</i><span>完成安装</span></div></div></aside>
<main>
<section id="welcome" class="page shown"><h1>选择安装版本</h1><p>程序会自动下载并完成配置。</p><div class="edition-list"><button class="edition" data-edition="cloud"><strong>云端版</strong><span>下载程序源码，使用云端服务</span></button><button class="edition" data-edition="local"><strong>本地版</strong><span>下载程序源码、本地环境和模型</span></button></div></section>
<section id="installing" class="page"><div class="page-head"><h1>正在安装</h1></div><div class="progress-hero"><b id="percent">0%</b><p id="task">准备中…</p></div><div id="module-track" class="module-track"></div><details><summary>详细信息</summary><pre id="log"></pre></details></section>
<section id="done" class="page hero"><div id="done-icon" class="done-icon">✓</div><h1 id="done-title">安装完成</h1><p id="done-message"></p></section>
<footer><button id="next" disabled>开始安装</button></footer>
</main><script src="app.js"></script></body></html>
