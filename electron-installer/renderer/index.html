<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My-Neuro 安装器</title><link rel="stylesheet" href="style.css"></head><body>
<aside><div class="brand"><div class="logo">N</div><span>My-Neuro</span></div><div class="steps"><div class="step active"><i>1</i><span>选择组件</span></div><div class="step"><i>2</i><span>确认安装</span></div><div class="step"><i>3</i><span>正在安装</span></div></div><div class="version">My-Neuro Installer</div></aside>
<main>
<section id="welcome" class="page shown hero"><div class="app-icon">N</div><h1>安装 My-Neuro</h1><p>此向导将下载并配置所需组件。</p></section>
<section id="components" class="page"><div class="page-head"><div><h1>选择组件</h1><p>选择你需要安装的功能。</p></div><span class="selection"><b id="selected-count">4</b> 项</span></div><div id="component-list"></div></section>
<section id="confirm" class="page"><div class="page-head"><div><h1>确认安装</h1><p>请确认以下信息。</p></div></div><div id="summary" class="card"></div><div class="notice">安装过程中请保持网络连接。</div></section>
<section id="installing" class="page"><div class="page-head"><div><h1>正在安装</h1><p id="task">准备中…</p></div><b id="percent">0%</b></div><div class="progress-block"><progress id="overall" max="100" value="0"></progress></div><details open><summary>详细信息</summary><pre id="log"></pre></details><div class="ring-progress" hidden></div></section>
<section id="done" class="page hero"><div id="done-icon" class="done-icon">✓</div><h1 id="done-title">安装完成</h1><p id="done-message"></p></section>
<footer><button id="back" class="secondary">上一步</button><button id="next">继续</button></footer>
</main><script src="app.js"></script></body></html>
